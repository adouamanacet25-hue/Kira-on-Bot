<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lord des Shinigami · King</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* NOUVELLE IMAGE DE FOND */
            background-image: url('https://i.ibb.co/XfnvP3TP/A81-E4898-0-EF4-4-E3-A-AD15-9-D2901-F1-C4-D0.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Overlay léger */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(2, 6, 18, 0.35);
            background-image: radial-gradient(ellipse at 50% 40%, rgba(20, 60, 30, 0.2) 0%, transparent 70%);
            z-index: 0;
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .container {
            position: relative;
            z-index: 1;
            width: 94%;
            max-width: 500px;
            max-height: 96vh;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(80, 200, 120, 0.25);
            border-radius: 18px;
            padding: 22px 24px 18px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                inset 0 0 60px rgba(80, 200, 120, 0.04);
            transition: all 0.3s ease;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        /* --- EN-TÊTE --- */
        .header {
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(80, 200, 120, 0.15);
        }

        .header .title-line1 {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(180, 220, 200, 0.8);
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            margin-bottom: 2px;
        }

        .header .title-main {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #b0f0d0;
            text-shadow:
                0 0 20px rgba(80, 200, 120, 0.4),
                0 4px 20px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .header .title-main .symbol {
            font-size: 26px;
            color: #70e0a0;
            opacity: 0.9;
        }

        .header .title-sub {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 5px;
            color: rgba(180, 220, 200, 0.8);
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            margin-top: 2px;
            text-transform: uppercase;
        }

        .header .title-sub span {
            color: #70e0a0;
            font-weight: 600;
            letter-spacing: 3px;
        }

        .badge-team {
            display: inline-block;
            margin-top: 6px;
            background: rgba(80, 200, 120, 0.12);
            border: 1px solid rgba(80, 200, 120, 0.20);
            border-radius: 30px;
            padding: 4px 18px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #70e0a0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* --- FORMULAIRE --- */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(180, 220, 200, 0.7);
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(80, 200, 120, 0.20);
            background: rgba(0, 4, 16, 0.5);
            color: #f0e8d8;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(180, 220, 200, 0.3);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            border-color: rgba(80, 200, 120, 0.50);
            box-shadow: 0 0 25px rgba(80, 200, 120, 0.06), inset 0 0 30px rgba(80, 200, 120, 0.03);
            background: rgba(0, 4, 16, 0.7);
        }

        /* --- BOUTONS --- */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        button.btn-action {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-ban {
            background: linear-gradient(145deg, rgba(180, 40, 40, 0.8), rgba(120, 20, 20, 0.9));
            color: #f0d8c8;
            border: 1px solid rgba(220, 80, 60, 0.25);
            box-shadow: 0 4px 20px rgba(180, 40, 40, 0.2);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .btn-ban:hover {
            transform: translateY(-2px) scale(1.01);
            background: linear-gradient(145deg, rgba(200, 50, 50, 0.9), rgba(140, 25, 25, 0.95));
            box-shadow: 0 8px 35px rgba(200, 50, 50, 0.3);
            border-color: rgba(220, 80, 60, 0.40);
        }
        .btn-ban:active {
            transform: scale(0.97);
        }

        .btn-unban {
            background: rgba(20, 40, 70, 0.7);
            color: rgba(180, 200, 220, 0.9);
            border: 1px solid rgba(100, 150, 200, 0.15);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .btn-unban:hover {
            transform: translateY(-2px) scale(1.01);
            background: rgba(30, 60, 100, 0.8);
            border-color: rgba(100, 150, 200, 0.30);
            color: #d0e8ff;
            box-shadow: 0 8px 35px rgba(60, 120, 200, 0.15);
        }
        .btn-unban:active {
            transform: scale(0.97);
        }

        /* --- MEDIA ACTIONS --- */
        .media-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(80, 200, 120, 0.08);
        }

        .img-select-btn {
            background: rgba(20, 30, 60, 0.5);
            border: 1px solid rgba(80, 200, 120, 0.12);
            color: rgba(180, 220, 200, 0.7);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .img-select-btn:hover {
            background: rgba(30, 50, 80, 0.7);
            border-color: rgba(80, 200, 120, 0.25);
            color: #f0e8d8;
        }

        #imagePreview {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            border: 1px solid rgba(80, 200, 120, 0.20);
            object-fit: cover;
            display: none;
            background: rgba(0, 0, 0, 0.4);
        }

        .btn-fake-chat {
            flex: 1;
            background: rgba(20, 40, 80, 0.5);
            color: rgba(180, 200, 220, 0.8);
            border: 1px solid rgba(100, 150, 200, 0.10);
            padding: 7px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .btn-fake-chat:hover {
            background: rgba(30, 60, 110, 0.7);
            border-color: rgba(100, 150, 200, 0.25);
            color: #d0e8ff;
        }

        /* --- TÉMOIGNAGES --- */
        .testimonials-wrapper {
            margin-top: 2px;
            border-top: 1px solid rgba(80, 200, 120, 0.08);
            padding-top: 12px;
        }

        .testimonials-title {
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(180, 220, 200, 0.4);
            margin-bottom: 8px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .scroll-container {
            height: 130px;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .scroll-container::-webkit-scrollbar {
            width: 4px;
        }
        .scroll-container::-webkit-scrollbar-track {
            background: rgba(0, 4, 16, 0.3);
            border-radius: 10px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: rgba(80, 200, 120, 0.20);
            border-radius: 10px;
        }

        .testimonial-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 4, 16, 0.4);
            border: 1px solid rgba(80, 200, 120, 0.06);
            border-radius: 10px;
            padding: 7px 12px;
            transition: 0.2s;
        }
        .testimonial-card:hover {
            border-color: rgba(80, 200, 120, 0.15);
            background: rgba(0, 4, 16, 0.6);
        }

        .testimonial-card img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 1px solid rgba(80, 200, 120, 0.10);
            object-fit: cover;
        }

        .testimonial-info {
            flex: 1;
            text-align: left;
        }
        .testimonial-phone {
            font-size: 14px;
            font-weight: 600;
            color: rgba(220, 210, 190, 0.9);
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        .testimonial-phone small {
            font-weight: 300;
            font-size: 11px;
            color: rgba(200, 180, 150, 0.4);
            margin-left: 6px;
        }

        /* --- FOOTER --- */
        .footer {
            margin-top: 12px;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(180, 220, 200, 0.25);
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* --- MENU & MODALE --- */
        .menu-wrapper {
            position: absolute;
            top: 14px;
            right: 18px;
        }
        .menu-btn {
            background: rgba(0, 4, 16, 0.5);
            border: 1px solid rgba(80, 200, 120, 0.10);
            color: rgba(180, 220, 200, 0.5);
            font-size: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s;
        }
        .menu-btn:hover {
            background: rgba(30, 50, 80, 0.6);
            color: rgba(220, 210, 190, 0.8);
            border-color: rgba(80, 200, 120, 0.20);
            transform: rotate(90deg);
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 18, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        #modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: rgba(5, 10, 28, 0.92);
            border: 1px solid rgba(80, 200, 120, 0.15);
            border-radius: 16px;
            width: 88%;
            max-width: 360px;
            padding: 28px 24px 24px;
            position: relative;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }
        .modal-box h2 {
            color: #70e0a0;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(80, 200, 120, 0.08);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .modal-box p {
            color: rgba(210, 200, 185, 0.9);
            font-size: 14px;
            line-height: 1.7;
            text-align: left;
            white-space: pre-line;
            font-weight: 300;
        }
        .modal-box p a {
            color: #70e0a0;
            text-decoration: none;
            border-bottom: 1px dotted rgba(80, 200, 120, 0.2);
            cursor: pointer;
            transition: 0.2s;
        }
        .modal-box p a:hover {
            color: #b0f0d0;
            border-bottom-color: rgba(80, 200, 120, 0.5);
        }

        .modal-close {
            position: absolute;
            top: -10px;
            right: -10px;
            background: rgba(30, 20, 40, 0.8);
            border: 1px solid rgba(80, 200, 120, 0.15);
            color: rgba(200, 180, 150, 0.6);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(60, 40, 80, 0.8);
            color: #f0e8d8;
            border-color: rgba(80, 200, 120, 0.30);
            transform: scale(1.08);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            .container {
                padding: 16px 14px 14px;
                border-radius: 14px;
            }
            .header .title-main {
                font-size: 22px;
                letter-spacing: 2px;
                gap: 8px;
            }
            .header .title-line1 {
                font-size: 11px;
                letter-spacing: 4px;
            }
            .header .title-sub {
                font-size: 11px;
                letter-spacing: 3px;
            }
            .btn-group {
                flex-direction: column;
                gap: 8px;
            }
            button.btn-action {
                padding: 10px 0;
                font-size: 12px;
            }
            .media-actions {
                flex-wrap: wrap;
                gap: 6px;
            }
            .btn-fake-chat {
                flex: 1 1 100%;
            }
            .testimonial-card {
                padding: 5px 10px;
            }
            .testimonial-card img {
                width: 36px;
                height: 36px;
            }
            .testimonial-phone {
                font-size: 12px;
            }
            .modal-box {
                padding: 22px 18px 18px;
            }
        }

        @media (max-width: 380px) {
            .header .title-main {
                font-size: 18px;
            }
            .header .title-line1 {
                font-size: 9px;
                letter-spacing: 3px;
            }
            .header .title-sub {
                font-size: 9px;
                letter-spacing: 2px;
            }
            .input-group input {
                font-size: 14px;
                padding: 10px 12px;
            }
        }

        /* --- animation d'entrée --- */
        .container {
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* --- glow sur le titre --- */
        @keyframes glowPulse {
            0%,
            100% {
                text-shadow: 0 0 20px rgba(80, 200, 120, 0.2), 0 4px 20px rgba(0,0,0,0.8);
            }
            50% {
                text-shadow: 0 0 40px rgba(80, 200, 120, 0.4), 0 4px 30px rgba(0,0,0,0.9);
            }
        }
        .header .title-main {
            animation: glowPulse 4s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Menu -->
        <div class="menu-wrapper">
            <button class="menu-btn" onclick="openModal('menu')" aria-label="Menu">☰</button>
        </div>

        <!-- EN-TÊTE -->
        <div class="header">
            <div class="title-line1">⚔ Lord des Shinigami ⚔</div>
            <div class="title-main">
                <span class="symbol">💸</span> ban <span class="symbol">💸</span>
            </div>
            <div class="title-sub">Chef de la <span>3e team</span></div>
            <div class="badge-team">✦ l'avarice royal✦</div>
        </div>

        <!-- Formulaire -->
        <div class="input-group">
            <label>📱 Numéro de la cible</label>
            <input type="text" id="phoneNumber" placeholder="Ex: +242061234567" autocomplete="off">
        </div>

        <!-- Boutons -->
        <div class="btn-group">
            <button class="btn-action btn-ban" onclick="handleAction('ban')">✖ Bannir</button>
            <button class="btn-action btn-unban" onclick="handleAction('unban')">✓ Débannir</button>
        </div>

        <!-- Media -->
        <div class="media-actions">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage(event)">
            <button class="img-select-btn" onclick="document.getElementById('fileInput').click()">📎 Ajouter une preuve</button>
            <img id="imagePreview" alt="Aperçu">
            <button class="btn-fake-chat" onclick="window.open('https://adouamanacet25-hue.github.io/Fake-chat-by-lord-Kira/', '_blank')">
                💬 Fake Chat
            </button>
        </div>

        <!-- Témoignages -->
        <div class="testimonials-wrapper">
            <div class="testimonials-title">⚖ Témoignages ⚖</div>
            <div class="scroll-container">

                <div class="testimonial-card">
                    <img src="https://i.ibb.co/6jK1pqg/E1-E4-FD14-0-DFB-4-E57-90-EA-5-F727-E49-AF2-B.jpg" alt="Témoin 1">
                    <div class="testimonial-info">
                        <div class="testimonial-phone">+221 786614801 <small>📵 off</small></div>
                    </div>
                </div>

                <div class="testimonial-card">
                    <img src="https://i.ibb.co/SD4Lv2n4/C11-D8-DA8-3621-446-A-8-D97-68-BD1-E89-B445.png" alt="Témoin 2">
                    <div class="testimonial-info">
                        <div class="testimonial-phone">+237 682230476 <small>📵 off</small></div>
                    </div>
                </div>

                <div class="testimonial-card">
                    <img src="https://i.ibb.co/2YdhQNF0/3-E2-AC3-CE-D4-D1-4-F12-A385-6-C7-B4-B361-F2-C.jpg" alt="Témoin 3">
                    <div class="testimonial-info">
                        <div class="testimonial-phone">+241 60249486 <small>📵 off</small></div>
                    </div>
                </div>

            </div>
        </div>

        <div class="footer">Signalez pour accélérer la purge</div>
    </div>

    <!-- MODALE -->
    <div id="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-box" id="modalContent">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 id="modalTitle">Titre</h2>
            <p id="modalText">Contenu.</p>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. MODALE
        // ============================================================
        const overlay = document.getElementById('modal-overlay');
        const titleEl = document.getElementById('modalTitle');
        const textEl = document.getElementById('modalText');

        const menuData = {
            'aide': {
                title: '⚔ Aide',
                text: '1. Saisissez un numéro (n\'importe quel chiffre).\n2. Cliquez sur "Bannir" ou "Débannir".\n3. L\'email vers le support WhatsApp s\'ouvrira avec le message correspondant.\n4. Vous pouvez ajouter une preuve (image) avant d\'envoyer.'
            },
            'propos': {
                title: '💸À propos',
                text: 'Version · v2.0\n\nInterface de jugement du "Lord des Shinigami".\nban, Chef de la troisième team, veille sur l\'équilibre.\n\nThème inspiré de la nature et des fées.'
            },
            'createur': {
                title: '✦ Créateur',
                text: 'ban · Lord des Shinigami\n\nChef de la troisième team.\nLe Roi des Fées, gardien des forêts.\n\n"La nature elle-même se plie à ma volonté."'
            },
            'contact': {
                title: '📧 Nous contacter',
                text: 'Support technique : support@whatsapp.com\n\nNous répondons dans les plus brefs délais.\n\n(Utilisez le formulaire pour ouvrir un email.)'
            },
            'menu': {
                title: '☰ Menu Jugement',
                text: 'Choisissez une option :\n\n➤ Aide\n➤ À propos\n➤ Créateur\n➤ Nous contacter\n\nCliquez sur le mot correspondant ci-dessous.'
            }
        };

        function openModal(section) {
            const data = menuData[section];
            if (data) {
                titleEl.textContent = data.title;
                let html = data.text.replace(/\n/g, '<br>');
                html = html.replace(/\b(Aide)\b/g, '<a onclick="openModal(\'aide\')">$1</a>');
                html = html.replace(/\b(À propos)\b/g, '<a onclick="openModal(\'propos\')">$1</a>');
                html = html.replace(/\b(Créateur)\b/g, '<a onclick="openModal(\'createur\')">$1</a>');
                html = html.replace(/\b(Nous contacter)\b/g, '<a onclick="openModal(\'contact\')">$1</a>');
                textEl.innerHTML = html;
                overlay.classList.add('active');
            }
        }

        function closeModal() {
            overlay.classList.remove('active');
        }

        function closeModalOutside(e) {
            if (e.target === overlay) closeModal();
        }

        // ============================================================
        //  2. IMAGE
        // ============================================================
        let currentImageData = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgPreview = document.getElementById('imagePreview');
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = 'block';
                    currentImageData = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // ============================================================
